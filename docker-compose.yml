services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports: ["3000:3000"]
    depends_on:
      redis: { condition: service_healthy }

volumes:
  redis-data:
