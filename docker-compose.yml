services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    # PostGIS (spec 006) + pgvector (matching-py, spec 010). Ver infra/postgres/Dockerfile.
    build: ./infra/postgres
    image: trempapp-postgres:local
    environment:
      POSTGRES_USER: ${DB_USER:-trempapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trempapp}
      POSTGRES_DB: ${DB_NAME:-trempapp}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (volumen vacío), en orden alfabético.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/002_add_preferences_columns.sql:/docker-entrypoint-initdb.d/02-migracion-002.sql:ro
      - ./db/003_vehiculo_catalogo.sql:/docker-entrypoint-initdb.d/03-migracion-003.sql:ro
      - ./db/004_trips_geo_outbox.sql:/docker-entrypoint-initdb.d/04-migracion-004.sql:ro
      - ./db/005_matching_views.sql:/docker-entrypoint-initdb.d/05-migracion-005.sql:ro
      - ./db/006_pagos_stripe.sql:/docker-entrypoint-initdb.d/06-migracion-006.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/09-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  # Grafo de Yucatán preparado una vez con infra/osrm/prepare.sh (no se descarga solo).
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "/data/yucatan.osrm"]
    ports: ["5000:5000"]
    volumes: ["./infra/osrm:/data:ro"]

  api:
    build: .
    env_file: .env
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres
      OSRM_URL: http://osrm:5000
      # matching-py corre fuera de este compose (otro repo); en Docker Desktop el host es host.docker.internal.
      MATCHING_URL: ${MATCHING_URL:-http://host.docker.internal:8000}
    ports: ["3000:3000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

volumes:
  redis-data:
  pg-data:
