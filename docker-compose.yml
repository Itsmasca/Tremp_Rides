services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-trempapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trempapp}
      POSTGRES_DB: ${DB_NAME:-trempapp}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (volumen vacío), en orden alfabético.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/002_add_preferences_columns.sql:/docker-entrypoint-initdb.d/02-migracion-002.sql:ro
      - ./db/003_vehiculo_catalogo.sql:/docker-entrypoint-initdb.d/03-migracion-003.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/09-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres
    ports: ["3000:3000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

volumes:
  redis-data:
  pg-data:
